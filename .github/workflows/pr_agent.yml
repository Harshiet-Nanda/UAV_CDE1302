name: CDE1302 PR Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created]

# The bot updates an existing PR/changelog; it never creates or approves a PR.
permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  analyze:
    if: >-
      github.event.sender.type != 'Bot' &&
      ((github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == 'main') ||
       (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        contains(fromJSON('["/review", "/describe", "/improve", "/update_changelog"]'), github.event.comment.body)))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Use trusted base code/config. Never execute code checked out from the PR.
      - name: Checkout trusted configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Detect first-time bootstrap
        run: |
          if [ ! -f .github/scripts/pr_agent_runner.py ]; then
            echo "PR_AGENT_BOOTSTRAP=true" >> "$GITHUB_ENV"
            echo "Base branch has no runner yet; merge setup, then test a new PR."
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Validate event before installing the agent
        if: env.PR_AGENT_BOOTSTRAP != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/pr_agent_runner.py --check

      - name: Install pinned PR-Agent
        if: env.PR_AGENT_BOOTSTRAP != 'true' && env.PR_AGENT_SUPERSEDED != 'true'
        run: python -m pip install 'pr-agent==0.48.0'

      - name: Analyze pull request
        if: env.PR_AGENT_BOOTSTRAP != 'true' && env.PR_AGENT_SUPERSEDED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_AI_STUDIO.GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          github.user_token: ${{ github.token }}
          LOG_LEVEL: INFO
        run: python .github/scripts/pr_agent_runner.py
